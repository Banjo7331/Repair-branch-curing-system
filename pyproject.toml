[project]
name = "repairbench"
version = "0.1.0"
description = "Determines how a pathogenic variant causes disease, from rules a geneticist can read."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bartosz" }]
# The core reads one YAML file and does arithmetic. Everything heavier —
# annotation, alignment, ML scoring — belongs to later modules, behind an
# interface, and should not be a dependency of the rule engine.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[project.scripts]
repairbench = "repairbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "PL"]
# RUF001/2/3 flag characters that look like ASCII but are not. The rule exists
# to catch homoglyph attacks in identifiers; here it fires only on prose, where
# an en dash is an en dash and 5′ UTR is how the notation is written. Rewriting
# the documentation in ASCII to satisfy a security check about identifiers would
# be the tail wagging the dog.
# PLR0913/PLR0917: a use case that takes eight collaborators is a use case with
# eight collaborators. Constructor injection is the point of a composition root,
# and hiding the count behind a service locator or a config object would make the
# dependencies less visible, not fewer.
ignore = ["ANN401", "PLR0913", "PLR0917", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR0915", "S101"]

[tool.mypy]
python_version = "3.11"
packages = ["repairbench"]
mypy_path = "src"
strict = true
warn_unreachable = true
